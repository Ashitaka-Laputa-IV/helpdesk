[project]
name = "helpdesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-reranker>=0.1.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
helpdesk = "helpdesk:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
